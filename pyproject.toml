[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a real Sentence-Transformers model (set DOCQA_TEST_ST_MODEL or allow a download); run with `pytest -m integration`",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
